<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>RGB Control</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top-bar">
    <div class="nfc-badge" id="nfcBadge">
        <span class="dot"></span>
        <span id="nfcText">NFC</span>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>
</div>

<div class="page">

    <div class="section">
        <div class="label-row">
            <span class="label">Brightness</span>
            <span class="val" id="brightnessVal">80%</span>
        </div>
        <input type="range" id="brightness" min="0" max="100" value="80">
    </div>

    <div class="card color-card" id="colorCard">
        <div class="color-card-header">
            <div class="color-card-swatch" id="colorSwatch"></div>
            <div class="color-card-meta">
                <div class="color-card-title">Custom Color</div>
                <div class="color-card-hex" id="colorHex">#FF8040</div>
            </div>
            <div class="color-check">✓</div>
        </div>
        <div class="color-picker">
            <span class="label">Hue</span>
            <input type="range" id="hueSlider" min="0" max="359" value="20">
            <span class="label" style="margin-top: 12px;">Saturation &amp; Brightness</span>
            <div class="sv-wrap">
                <canvas id="svCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="cat-bar" id="catBar"></div>
    <div id="effectList"></div>

</div>

<div class="send-bar">
    <div class="send-inner">
        <button class="btn btn-primary" id="sendBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <circle cx="12" cy="20" r="1"/>
            </svg>
            Send to Device
        </button>
    </div>
</div>

<div class="modal" id="syncModal">
    <div class="modal-content">
        <div class="modal-icon pulse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <circle cx="12" cy="20" r="1"/>
            </svg>
        </div>
        <h2 id="syncTitle">Ready to Sync</h2>
        <p id="syncMsg">Hold your phone against the device's NFC icon.</p>
        <button class="ghost" id="syncCancel">Cancel</button>
    </div>
</div>

<div id="toast-container"></div>

<script type="module" src="app.js"></script>
</body>
</html>
